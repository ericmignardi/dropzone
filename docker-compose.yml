services:
  postgres:
    image: postgres:16-alpine
    container_name: dropzone-db
    environment:
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: dropzone123
      POSTGRES_DB: dropzone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropzone"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dropzone-backend
    environment:
      DATABASE_URL: postgresql://dropzone:dropzone123@postgres:5432/dropzone
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dropzone-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
