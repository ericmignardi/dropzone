services:
  postgres:
    image: postgres:16-alpine
    container_name: dropzone-db
    environment:
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: dropzone123
      POSTGRES_DB: dropzone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropzone"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
